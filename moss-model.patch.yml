- insert:
    - id: experiment-store
      name: ./internal/experiment/plugin.mjs
      config:
        path: !!js process.env.MOSS_EXPERIMENT_DB
        create: false
    - id: labscriptai-runtime
      name: ./internal/experiment/runtime-plugin.mjs
      config:
        root: !!js process.env.MOSS_PLUGIN_ROOT
        data: !!js process.env.MOSS_PLUGIN_DATA
        dependencyHome: !!js process.env.LABSCRIPTAI_HOME
        version: !!js process.env.MOSS_PLUGIN_VERSION
        timeoutMs: 300000
    - id: experiment-preview
      name: ./internal/experiment/preview-plugin.mjs
      config:
        temporaryRoot: !!js process.env.MOSS_PREVIEW_TMP
    - id: robot-status
      name: ./internal/experiment/robot-status-plugin.mjs
      config:
        timeoutMs: 6000
        maxBytes: 262144
    - id: robot-control
      name: ./internal/experiment/robot-control-plugin.mjs
      config:
        url: !!js "process.env.OPENTRONS_URL ?? ''"
        allowLive: !!js "process.env.MOSS_ALLOW_LIVE_ROBOT === '1'"
    - id: protocol-analyzer
      name: ./internal/experiment/analyzer-plugin.mjs
    - id: experiment-workflow
      name: ./internal/experiment/workflow-plugin.mjs
    - id: experiment-agent-tools
      name: ./internal/experiment/agent-tools.mjs
    - id: experiment-demo
      name: ./internal/experiment/demo-plugin.mjs
      config:
        temporaryRoot: !!js process.env.MOSS_PREVIEW_TMP
    - id: xiaozhi-readonly
      name: ./internal/xiaozhi/plugin.mjs
      config:
        sessionId: null
        agentPreset: moss-experiment
        bindingPath: !!js "process.env.DSH_HOME + '/xiaozhi-session.json'"
        workspacePath: !!js process.cwd()
        feedback:
          offsetsMs: [0, 15000, 45000]
          pollWaitMs: 4000
        transport:
          reconnectMinMs: 1000
          reconnectMaxMs: 30000
          connectTimeoutMs: 10000
          heartbeatMs: 20000
        wakeup:
          enabled: !!js "process.env.MOSS_AUTO_WAKE === '1'"
          browserApp: !!js "process.env.MOSS_BROWSER_APP || 'Google Chrome'"
          timeoutMs: 10000
- insert:
    - id: preset-moss-experiment
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: moss-experiment
        name: 实验助手
        description: 实验方案、三维预览和机器人运行
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the laboratory experiment assistant. Respond briefly in the user's language.
                For a simple echo or connectivity test, respond directly.
                While preparing, accept amendments. Preserve confirmed conditions and the same experiment ID.
                When essential conditions are missing, call request_experiment_input with one grouped question and wait.
                Confirm Flex or OT-2 before choosing the protocol API, labware, pipettes, and slot layout.
                For a follow-up, read the current experiment revision, update it, and analyze the new revision.
                Create a new experiment only on explicit request or when the session has no experiment yet.
                Use the experiment tools for local analysis and preview. Physical results require a real run.
                When explicitly asked to operate a physical robot, use the robot tools and the workbench confirmation.
                Read get_robot_run for actual results. If the connection drops, read the run before attempting any further operation.
                Do not inspect or modify application code or run shell commands.
              complete: true
              includeRuntimeContext: false
          - id: robot-tools
            name: './internal/experiment/robot-tools.mjs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
- insert:
    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful conversational assistant. Answer directly without using tools.
              complete: true
              includeRuntimeContext: false
          - id: chat-tools
            name: './internal/chat-tools.mjs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
- id: llm-pi-ai
  config:
    providers:
      lab-gateway:
        displayName: LabScriptAI
        apiKeyEnv: AI_API_KEY
        api: openai-completions
        baseURL: !!js "process.env.AI_API_URL.substring(0, process.env.AI_API_URL.lastIndexOf('/chat/completions'))"
        models:
          - id: !!js process.env.AI_MODEL
- id: agent-default-model
  config:
    provider: lab-gateway
    model: !!js process.env.AI_MODEL
