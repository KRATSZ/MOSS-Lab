name: MOSS web

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moss-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: Build and test web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Linux confinement toolchain
        run: |
          stat -Lc '%a %U %G %n' /etc/resolv.conf
          for account in runner _apt; do
            if sudo -u "$account" timeout 15 getent ahostsv4 archive.ubuntu.com; then
              printf 'Ubuntu DNS resolves for %s\n' "$account"
            else
              printf 'Ubuntu DNS lookup failed for %s\n' "$account"
            fi
          done
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -q -o APT::Update::Error-Mode=any -o Acquire::Retries=0
          sudo apt-get install -yq musl-tools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web and check types
        run: pnpm run build
      - name: Test approval policy
        run: node --test .github/review-ownership/check-approval.test.mjs
      - name: Test experiment storage and preview resources
        run: node --import tsx/esm --test internal/experiment/tests/workflow.test.mjs internal/experiment/tests/agent-tools.test.mjs internal/experiment/tests/preview-resources.test.mjs internal/experiment/tests/robot-status-plugin.test.mjs internal/experiment/tests/robot-control.test.mjs internal/xiaozhi/*.test.mjs
      - name: Test plugin lock, recovery and download resources
        run: node --import tsx/esm --test internal/experiment/tests/plugin-runtime.test.mjs internal/experiment/tests/preview-recovery.test.mjs
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: labscriptai-ot.lock.json
      - name: Build the Linux confinement launcher
        run: pnpm --dir native/system run build:native
      - name: Check the pinned plugin through public MCP
        run: node --import tsx/esm scripts/check-labscriptai.mjs
      - name: Test robot commands through pinned MCP and a loopback robot
        run: node --import tsx/esm --test internal/experiment/tests/robot-mcp-integration.test.mjs
      - name: Test client and workflow integration
        run: >-
          pnpm exec vitest run
          packages/client/ui-sidebar-experiment/tests/bundle.client.spec.ts
          packages/client/ui-sidebar-experiment/tests/experiment.client.spec.tsx
          packages/client/ui-sidebar-experiment/tests/voice-workbench.client.spec.tsx
          packages/test-support/client-runtime/tests/assembly-test-client.client.spec.ts
          scripts/build-exe-for-python-sdk-office.spec.ts
      - name: Install Chromium for browser verification
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Test built web boot and voice continuation
        env:
          MOSS_TEST_REAL_OT: '1'
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/built-boot.expected.e2e.ts apps/web/tests/voice-workbench.e2e.ts
